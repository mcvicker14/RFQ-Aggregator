name: COREWORKS / APEX scheduled sync

# Why this exists: Render's free-tier web service (principal-oi-api) sleeps when idle
# and only wakes on an incoming request. The in-process APScheduler safety net in
# backend/app/main.py only fires while that process happens to be awake, so it alone
# can't guarantee APEX's "every day at 6:00 PM America/Chicago" requirement or
# COREWORKS's polling interval actually get checked — an external ping is what wakes
# the service reliably regardless of whether anyone else is using the app at the time.
#
# Runs every 15 minutes, every day — deliberately more often than either source
# actually needs. The check it calls is idempotent and cheap: it returns immediately
# for whichever source isn't due yet (see backend/app/services/scheduled_sync.py), and
# only actually triggers a sync for a source once it's genuinely due. The exact firing
# time within a 15-minute window doesn't matter for either source's requirement — APEX
# only needs "on or after 6:00 PM America/Chicago, once that day," not "at exactly
# 6:00:00 PM."
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # lets you trigger a check manually from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call the scheduled-sync-check endpoint
        run: |
          curl -sS -X POST "${API_BASE_URL%/}/api/intelligence/scheduled-sync-check" \
            -H "Content-Type: application/json" \
            -d "{\"secret\": \"${SCHEDULED_SYNC_SECRET}\"}" \
            --fail-with-body
        env:
          API_BASE_URL: ${{ secrets.SCHEDULED_SYNC_API_BASE_URL }}
          SCHEDULED_SYNC_SECRET: ${{ secrets.SCHEDULED_SYNC_SECRET }}
