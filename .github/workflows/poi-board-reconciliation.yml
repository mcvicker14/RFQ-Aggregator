name: POI board reconciliation

# Install this same file on the default branch: schedule events do not run from
# the deployed feature branch. No application code is merged into legacy main.
on:
  schedule:
    # Both Central offsets. The step below admits ONLY 09/12/16/20 Central.
    # Four checks in each due hour provide retries without round-the-clock wakes.
    - cron: "0,15,30,45 1,2,14,15,17,18,21,22 * * *"
  workflow_dispatch: {}

permissions: {}
concurrency:
  group: poi-board-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check Central-time window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          local = datetime.now(ZoneInfo("America/Chicago"))
          due = local.hour in (9, 12, 16, 20) or os.environ["EVENT_NAME"] == "workflow_dispatch"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"due={'true' if due else 'false'}\n")
          PY
      - name: Reconcile the board only
        if: steps.window.outputs.due == 'true'
        env:
          API_BASE_URL: https://principal-oi-api.onrender.com
          BOARD_RECONCILIATION_SECRET: ${{ secrets.STATUS_BOARD_RECONCILIATION_SECRET }}
        run: |
          if [ -z "$BOARD_RECONCILIATION_SECRET" ]; then
            echo "Approved board scheduler credential is unavailable; no request sent."
            exit 1
          fi
          # One request per check. A retry-wait response must never hide a failure.
          # The next existing scheduled check retries after the server backoff.
          python3 - <<'PY'
          # BEGIN VERIFIED BOARD CHECK
          import json, os, sys
          from datetime import datetime, time, timedelta, timezone
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen

          def check_board():
              secret = os.environ.get("BOARD_RECONCILIATION_SECRET")
              if not secret:
                  raise ValueError("Board credential unavailable")
              base = os.environ["API_BASE_URL"].rstrip("/")
              if base != "https://principal-oi-api.onrender.com":
                  raise ValueError("Unexpected board endpoint")
              central = ZoneInfo("America/Chicago")
              now = datetime.now(timezone.utc).astimezone(central)
              due = [hour for hour in (9, 12, 16, 20) if hour <= now.hour]
              day = now.date() if due else now.date() - timedelta(days=1)
              expected = datetime.combine(day, time(due[-1] if due else 20), central)
              request = Request(base + "/api/status-board/reconciliation-check",
                                data=json.dumps({"secret": secret}).encode(),
                                headers={"Content-Type": "application/json"}, method="POST")
              with urlopen(request, timeout=180) as response:
                  if response.status != 200:
                      raise ValueError("Board HTTP status did not confirm completion")
                  result = json.load(response)
              if not isinstance(result, dict) or result.get("reason") != "completed" or result.get("last_error") is not None:
                  raise ValueError("Board did not confirm a completed error-free slot")
              slot = datetime.fromisoformat(result["slot_at"].replace("Z", "+00:00"))
              if slot.tzinfo is None or slot < expected or slot > datetime.now(timezone.utc):
                  raise ValueError("Board completion is stale or has no timezone")
              print("Board reconciliation confirmed", slot.isoformat())

          if __name__ == "__main__":
              try:
                  check_board()
              except Exception:
                  # Never echo request/credential or an untrusted response body.
                  print("Board reconciliation unconfirmed; inspect application state. No success recorded.", file=sys.stderr)
                  sys.exit(1)
          # END VERIFIED BOARD CHECK
          PY
